name: Commit Policy

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  commit-policy:
    name: Commit Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate accepted commit messages
        uses: asamarts/alint@465e70c48ec13774c8cb3bb58856b58b71e3a93d  # v0.23.0
        with:
          version: "v0.22.1"
        env:
          ALINT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
