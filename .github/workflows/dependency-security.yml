name: Dependency Security

permissions:
  contents: read

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Install dependency security tools
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2.90.8
        with:
          tool: cargo-audit,cargo-deny

      - name: Check RustSec advisories
        run: cargo audit --deny warnings --no-yanked

      - name: Check dependency policy
        run: cargo deny check advisories licenses bans sources
