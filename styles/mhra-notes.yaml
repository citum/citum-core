# yaml-language-server: $schema=https://docs.citum.org/schemas/style.json
version: "0.78.0"
info:
  title: MHRA Style Guide 4th edition (notes)
  id: http://www.zotero.org/styles/mhra-notes
  default-locale: en-GB
  short-name: "MHRA"
  edition: "4th edition"
options:
  locale-override: en-GB-mhra
  date-fallback: standard
  locators:
    default-label-form: short
    range-format: expanded
    fallback-delimiter: ", "
  substitute:
    contributor-role-form: short
    candidates: none
  processing: note
  contributors:
    and: text
    delimiter-precedes-last: contextual
    demote-non-dropping-particle: display-and-sort
  dates:
    month: long
    uncertainty-marker: "?"
    approximation-marker: "ca. "
    range-delimiter: –
    show-seconds: false
    show-timezone: false
  titles:
    component: plain
    monograph:
      emph: true
    periodical:
      emph: true
  range-format: minimal-two
  punctuation-in-quote: true
citation:
  options:
    contributors:
      delimiter-precedes-last: contextual
      shorten:
        min: 4
        use-first: 1
        and-others: et-al
  subsequent:
    options:
      contributors:
        name-form: family-only
    template:
      - contributor: author
        form: short
      - title: primary
        form: short
        wrap:
          punctuation: quotes
      - variable: locator
        prefix: ", "
  type-variants:
    article-journal:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - title: parent-serial
        emph: true
      - number: volume
      - number: issue
        prefix: "."
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
        prefix: " "
      - number: pages
        prefix: ", "
        label-form: short
        show-with-locator: true
      - variable: locator
        wrap:
          punctuation: parentheses
        prefix: " "
      - variable: doi
        prefix: ", doi:"
    article-magazine:
      extends: article-journal
      remove:
        - match:
            variable: locator
    book:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
      - contributor: translator
        form: verb-short
        prefix: ", "
      - number: edition
        prefix: ", "
      - group:
          - variable: publisher
          - date: issued
            form: year
        delimiter: ", "
        prefix: " ("
        suffix: ")"
    chapter:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - title: parent-monograph
        emph: true
      - title: parent-serial
        emph: true
      - contributor: editor
        form: verb
        name-order: given-first
      - variable: publisher
        prefix: " ("
      - number: pages
        label-form: short
        show-with-locator: true
      - number: volume
      - variable: url
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
        prefix: " "
      - variable: doi
    dataset:
      remove:
        - match:
            date: issued
    entry-encyclopedia:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - title: parent-monograph
        emph: true
      - title: parent-serial
        emph: true
      - contributor: editor
        form: verb
        name-order: given-first
      - variable: publisher
        prefix: " ("
      - number: pages
        label-form: short
        show-with-locator: true
      - number: volume
      - variable: url
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
        prefix: " "
      - variable: doi
    paper-conference:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - title: parent-monograph
        emph: true
      - number: volume
      - date: issued
        form: year
        prefix: ", "
      - number: pages
        prefix: ", "
        label-form: short
        show-with-locator: true
      - variable: doi
        prefix: ", doi:"
    patent:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
      - number: patent-number
        prefix: ", Patent "
      - delimiter: ""
        group:
          - date: issued
            form: month-day
            prefix: ", issued "
          - date: issued
            form: year
            prefix: ", "
    interview:
      - contributor: interviewer
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - variable: raw-genre
        prefix: ", "
      - contributor: interviewee
        form: long
        prefix: " with "
      - delimiter: ""
        group:
          - date: issued
            form: month-day
            prefix: ", "
          - date: issued
            form: year
            prefix: ", "
      - variable: url
        prefix: " &#60;"
        suffix: "&#62;"
    article-newspaper:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - variable: section
        prefix: ", "
      - title: parent-serial
        emph: true
        prefix: ", "
      - date: issued
        form: month-day-year
        prefix: ", "
    broadcast:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - title: parent-serial
        emph: true
      - date: issued
        form: month-day-year
        wrap:
          punctuation: parentheses
        prefix: " "
      - number: issue
        prefix: ", episode "
    motion-picture:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
      - variable: raw-genre
        prefix: ", "
      - contributor: director
        form: long
        prefix: ", dir. by "
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
        prefix: " "
    report:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
      - group:
          - variable: publisher
          - date: issued
            form: year
        delimiter: ", "
        prefix: " ("
        suffix: ")"
    thesis:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - group:
          - variable: raw-genre
            prefix: "unpublished "
          - variable: publisher
          - date: issued
            form: year
        delimiter: ", "
        prefix: " ("
        suffix: ")"
    webpage:
      - contributor: author
        form: long
        name-order: given-first
      - title: primary
        wrap:
          punctuation: quotes
      - date: issued
        form: year
        prefix: ", "
      - variable: url
        prefix: " &#60;"
        suffix: "&#62;"
      - date: accessed
        form: month-day-year
        prefix: " [accessed "
        suffix: "]"
  template:
    - contributor: author
      form: long
      name-order: given-first
    - title: primary
      wrap:
        punctuation: quotes
    - title: parent-monograph
      emph: true
    - title: parent-serial
      emph: true
    - contributor: editor
      form: verb
      name-order: given-first
    - variable: publisher
      prefix: " ("
    - number: pages
      show-with-locator: true
    - number: volume
    - variable: url
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: " "
    - variable: doi
  suffix: .
  delimiter: ", "
  multi-cite-delimiter: "; "
bibliography:
  options:
    subsequent-author-substitute: ——
    subsequent-author-substitute-rule: partial-first
    hanging-indent: true
    separator: " "
    contributors:
      delimiter-precedes-last: always
      shorten:
        min: 4
        use-first: 1
        and-others: et-al
  type-variants:
    article-journal:
      modify:
        - match:
            number: pages
          label-form: short
      remove:
        - match:
            title: parent-monograph
        - match:
            contributor: editor
        - match:
            variable: publisher
    article-magazine:
      modify:
        - match:
            number: pages
          label-form: short
      remove:
        - match:
            title: parent-monograph
        - match:
            contributor: editor
        - match:
            variable: publisher
    chapter:
      modify:
        - match:
            number: pages
          label-form: short
    dataset:
      remove:
        - match:
            date: issued
    entry-encyclopedia:
      modify:
        - match:
            number: pages
          label-form: short
    paper-conference:
      extends: article-journal
      remove:
        - match:
            title: parent-serial
      add:
        - component:
            title: parent-monograph
            emph: true
          before:
            number: volume
    patent:
      - group:
          - contributor: author
            form: long
            name-order: family-first-only
          - title: primary
        delimiter: ", "
      - number: patent-number
        prefix: ", Patent "
      - date: issued
        form: month-day-year
        prefix: ", issued "
    personal-communication: []
    interview:
      - group:
          - contributor: interviewer
            form: long
            name-order: family-first-only
          - title: primary
            wrap:
              punctuation: quotes
        delimiter: ", "
      - variable: raw-genre
        prefix: ", "
      - contributor: interviewee
        form: long
        prefix: " with "
      - date: issued
        form: month-day-year
        prefix: ", "
      - variable: url
        prefix: " &#60;"
        suffix: "&#62;"
    article-newspaper:
      - group:
          - contributor: author
            form: long
            name-order: family-first-only
          - title: primary
            wrap:
              punctuation: quotes
        delimiter: ", "
      - variable: section
        prefix: ", "
      - title: parent-serial
        emph: true
        prefix: ", "
      - date: issued
        form: month-day-year
        prefix: ", "
    broadcast:
      - contributor: author
        form: long
        name-order: family-first-only
      - title: primary
        prefix: ", "
        wrap:
          punctuation: quotes
      - title: parent-serial
        emph: true
      - date: issued
        form: month-day-year
        wrap:
          punctuation: parentheses
        prefix: " "
      - number: issue
        prefix: ", episode "
    motion-picture:
      - contributor: author
        form: long
        name-order: family-first-only
      - title: primary
        prefix: ", "
      - variable: raw-genre
        prefix: ", "
      - contributor: director
        form: long
        prefix: ", dir. by "
      - date: issued
        form: year
        wrap:
          punctuation: parentheses
        prefix: " "
    report:
      - contributor: author
        form: long
        name-order: family-first-only
      - title: primary
        prefix: ", "
      - variable: raw-genre
        prefix: ", "
      - contributor: editor
        form: verb
        name-order: given-first
        prefix: ", "
      - group:
          - variable: publisher
          - date: issued
            form: year
        delimiter: ", "
        prefix: " ("
        suffix: ")"
    thesis:
      - contributor: author
        form: long
        name-order: family-first-only
      - title: primary
        prefix: ", "
        wrap:
          punctuation: quotes
      - group:
          - variable: raw-genre
            prefix: "unpublished "
          - variable: publisher
          - date: issued
            form: year
        delimiter: ", "
        prefix: " ("
        suffix: ")"
    webpage:
      - contributor: author
        form: long
        name-order: family-first-only
      - title: primary
        prefix: ", "
        wrap:
          punctuation: quotes
      - date: issued
        form: year
        prefix: ", "
      - variable: url
        prefix: " &#60;"
        suffix: "&#62;"
      - date: accessed
        form: month-day-year
        prefix: " [accessed "
        suffix: "]"
    book:
      - group:
          - contributor: author
            form: long
            name-order: family-first-only
          - title: primary
        delimiter: ", "
      - contributor: translator
        form: verb-short
        prefix: ", "
      - number: edition
        prefix: ", "
      - variable: publisher
        prefix: " ("
      - date: issued
        form: year
        prefix: ", "
        suffix: ")"
  template:
    - group:
        - contributor: author
          form: long
          name-order: family-first-only
        - title: primary
          wrap:
            punctuation: quotes
      delimiter: ", "
    - title: parent-monograph
      emph: true
      prefix: ", "
    - title: parent-serial
      emph: true
      prefix: ", "
    - contributor: editor
      form: verb
      name-order: given-first
      prefix: ", "
    - variable: publisher
      prefix: " ("
    - number: volume
      prefix: ", "
    - number: issue
      prefix: "."
    - date: issued
      form: year
      wrap:
        punctuation: parentheses
      prefix: " "
    - number: pages
      prefix: ", "
    - variable: doi
      prefix: ", doi:"
    - variable: url
      prefix: " "
  sort:
    template:
      - key: author
        ascending: true
      - key: title
        ascending: true
      - key: issued
        ascending: true
      - key: issued
        ascending: true
      - key: issued
        ascending: true
